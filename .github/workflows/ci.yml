name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml jsonschema pytest
      - name: Lint GPT project
        run: python scripts/lint_gpt_project.py --project-root .
      - name: Regression tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Validate model robustness
        run: python scripts/validate_model_robustness.py --project-root .
      - name: Validate eval coverage
        run: python scripts/validate_eval_coverage.py --project-root .
      - name: Final project hygiene
        run: python scripts/project_hygiene.py --project-root . --mode final
      - name: Build all configured distributions
        run: python scripts/build_distributions.py --project-root . --version 0.0.0-ci
      - name: Validate distributions
        run: python scripts/validate_distributions.py --project-root .
      - name: Verify OpenAI Plugin distribution
        shell: bash
        run: |
          set -euo pipefail
          ZIP="dist/prototypspecialisten-plugin-0.0.0-ci.zip"
          unzip -l "$ZIP" | grep 'plugin.json'
          unzip -l "$ZIP" | grep 'skills/prototypspecialisten/SKILL.md'
          unzip -l "$ZIP" | grep 'runtime-contract.json'
          python - <<'PY'
          import json, zipfile
          path = "dist/prototypspecialisten-plugin-0.0.0-ci.zip"
          with zipfile.ZipFile(path) as zf:
              contract = json.loads(zf.read("runtime-contract.json"))
              skill = zf.read("skills/prototypspecialisten/SKILL.md").decode("utf-8")
          assert contract["runtime_id"] == "openai_plugin"
          caps = contract["capabilities"]["requirements"]
          assert caps["filesystem"]["read"] == "required"
          assert caps["filesystem"]["write"] == "required"
          assert caps["code_execution"]["level"] == "required"
          assert caps["persistent_state"]["level"] == "required"
          assert "Gör aldrig Playwright/Chromium till ett krav för färdigställande." in skill
          assert "Föredra Agent Workspace när det är tillgängligt och konfigurerat." in skill
          PY
      - name: Validate runtime parity
        run: python scripts/validate_runtime_parity.py --project-root .
      - name: Validate release readiness model
        run: python scripts/validate_release_readiness.py --project-root . --version 0.0.0-ci --mode ci
      - name: Upload CI distributions
        uses: actions/upload-artifact@v4
        with:
          name: prototypspecialisten-ci-distributions
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/DELIVERY-MANIFEST.json
          if-no-files-found: error
