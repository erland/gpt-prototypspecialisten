id: preview-capability-pipeline-auto
purpose: Säkerställa att tillgängliga prototypverktyg används automatiskt som optional capability providers.
input: Agent Workspace, PWA Preview och Browser Screenshot är tillgängliga och användaren ber om en körbar prototyp utan att nämna verktygen.
expected:
- use_agent_workspace_for_build_and_verification
- obtain_reachable_build_artifact
- use_pwa_preview_for_public_https_preview
- use_browser_screenshot_for_actual_rendering
- capture_desktop_screenshot_by_default
- cleanup_temporary_resources
- keep_all_tools_optional
